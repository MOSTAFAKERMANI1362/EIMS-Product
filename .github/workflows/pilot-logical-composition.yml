name: Pilot Logical Composition

on:
  pull_request:
    paths:
      - 'src/EIMS.HrImport/**'
      - 'src/EIMS.Identity.Rbac/**'
      - 'src/EIMS.Authority.Recovery/**'
      - 'src/EIMS.Persistence.Recovery/**'
      - 'src/EIMS.PilotAssembly.Binding/**'
      - 'src/EIMS.PilotAssembly.Core/**'
      - 'src/EIMS.PilotAssembly.Host/**'
      - 'recovery/p1-wave4/**'
      - 'tests/EIMS.PilotLogicalComposition.ContractTests/**'
      - 'tests/EIMS.P1P5.RuntimeBinding.ContractTests/**'
      - '.github/workflows/pilot-logical-composition.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/EIMS.HrImport/**'
      - 'src/EIMS.Identity.Rbac/**'
      - 'src/EIMS.Authority.Recovery/**'
      - 'src/EIMS.Persistence.Recovery/**'
      - 'src/EIMS.PilotAssembly.Binding/**'
      - 'src/EIMS.PilotAssembly.Core/**'
      - 'src/EIMS.PilotAssembly.Host/**'
      - 'recovery/p1-wave4/**'
      - 'tests/EIMS.PilotLogicalComposition.ContractTests/**'
      - 'tests/EIMS.P1P5.RuntimeBinding.ContractTests/**'
      - '.github/workflows/pilot-logical-composition.yml'

permissions:
  contents: read

jobs:
  compose-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Show SDK
        shell: pwsh
        run: dotnet --version

      - name: Build logical composition tests
        shell: pwsh
        run: dotnet build .\tests\EIMS.PilotLogicalComposition.ContractTests\EIMS.PilotLogicalComposition.ContractTests.csproj -c Release

      - name: Run logical composition tests
        shell: pwsh
        run: dotnet run --project .\tests\EIMS.PilotLogicalComposition.ContractTests\EIMS.PilotLogicalComposition.ContractTests.csproj -c Release --no-build
