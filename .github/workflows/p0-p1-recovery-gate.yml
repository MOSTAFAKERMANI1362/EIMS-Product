name: P0 P1 Recovery Gate

on:
  pull_request:
    paths:
      - 'recovery/p0/**'
      - 'recovery/p1-wave1/**'
      - 'recovery/p1-wave2/**'
      - 'recovery/p1-wave3/**'
      - 'recovery/p1-wave4/**'
      - 'src/EIMS.P0.MachineRecovery/**'
      - 'src/EIMS.Authority.Recovery/**'
      - 'tests/EIMS.P0P1.RecoveryGate.ContractTests/**'
      - '.github/workflows/p0-p1-recovery-gate.yml'
  push:
    branches: [ main ]
    paths:
      - 'recovery/p0/**'
      - 'recovery/p1-wave1/**'
      - 'recovery/p1-wave2/**'
      - 'recovery/p1-wave3/**'
      - 'recovery/p1-wave4/**'
      - 'src/EIMS.P0.MachineRecovery/**'
      - 'src/EIMS.Authority.Recovery/**'
      - 'tests/EIMS.P0P1.RecoveryGate.ContractTests/**'
      - '.github/workflows/p0-p1-recovery-gate.yml'

permissions:
  contents: read

jobs:
  p0-p1-consistency:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Build consistency gate
        run: dotnet build .\tests\EIMS.P0P1.RecoveryGate.ContractTests\EIMS.P0P1.RecoveryGate.ContractTests.csproj -c Release

      - name: Run P0-P1 recovery consistency tests
        run: dotnet run --project .\tests\EIMS.P0P1.RecoveryGate.ContractTests\EIMS.P0P1.RecoveryGate.ContractTests.csproj -c Release --no-build -- .\recovery\p0\P0_MACHINE_CONTRACT_RECOVERY_v1.0.json .\recovery\p1-wave1\P1_WAVE1_STATE_REBASELINE_ACCEPTANCE_v1.0.json .\recovery\p1-wave2\P1_WAVE2_G03_RULE_REBASELINE_v1.0.json .\recovery\p1-wave3\P1_WAVE3_G03_EVENT_REBASELINE_v1.0.json .\recovery\p1-wave4\P1_WAVE4_G03_MUTATION_REBASELINE_v1.0.json
