name: P1 Wave 6 Evaluation Completion

on:
  pull_request:
    paths:
      - 'architecture/decisions/ACR-P0-005_EVALUATION_ASSIGNMENT_COMPLETION_v1.0.json'
      - 'recovery/evaluation-schemas/**'
      - 'recovery/p1-wave6/**'
      - 'src/EIMS.Authority.Recovery/**'
      - 'src/EIMS.Persistence.Recovery/**'
      - 'src/EIMS.Identity.Rbac/**'
      - 'src/EIMS.PilotAssembly.Core/**'
      - 'tests/EIMS.P1.Wave6.EvaluationCompletion.ContractTests/**'
      - '.github/workflows/p1-wave6-evaluation-completion.yml'
  push:
    branches: [ main ]
    paths:
      - 'recovery/p1-wave6/**'
      - 'src/EIMS.Authority.Recovery/**'
      - 'src/EIMS.Persistence.Recovery/**'
      - 'tests/EIMS.P1.Wave6.EvaluationCompletion.ContractTests/**'
      - '.github/workflows/p1-wave6-evaluation-completion.yml'

permissions:
  contents: read

jobs:
  verify-wave6:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Build Wave 6 evaluator completion tests
        run: dotnet build .\tests\EIMS.P1.Wave6.EvaluationCompletion.ContractTests\EIMS.P1.Wave6.EvaluationCompletion.ContractTests.csproj -c Release

      - name: Run Wave 6 evaluator completion tests
        run: dotnet run --project .\tests\EIMS.P1.Wave6.EvaluationCompletion.ContractTests\EIMS.P1.Wave6.EvaluationCompletion.ContractTests.csproj -c Release --no-build -- .\recovery\evaluation-schemas\EVALUATOR_ASSESSMENT_SCHEMA_REGISTRY_v1.0.json .\architecture\decisions\ACR-P0-005_EVALUATION_ASSIGNMENT_COMPLETION_v1.0.json .\recovery\p1-wave6\P1_WAVE6_EVALUATION_COMPLETION_REBASELINE_v1.0.json
