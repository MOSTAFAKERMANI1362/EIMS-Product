name: P1 Wave 10 Execution Runtime

on:
  pull_request:
    paths:
      - 'src/EIMS.Authority.Recovery/**'
      - 'src/EIMS.Persistence.Recovery/**'
      - 'tests/EIMS.P1.Wave10.Execution.ContractTests/**'
      - 'tests/EIMS.P1.Wave10.ExecutionIntake.ContractTests/**'
      - 'architecture/decisions/ACR-P0-008_POST_G04_COMMAND_BINDING_v1.0.json'
      - 'recovery/p1-wave10/**'
      - '.github/workflows/p1-wave10-execution.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/EIMS.Authority.Recovery/**'
      - 'src/EIMS.Persistence.Recovery/**'
      - 'tests/EIMS.P1.Wave10.Execution.ContractTests/**'
      - 'tests/EIMS.P1.Wave10.ExecutionIntake.ContractTests/**'
      - 'architecture/decisions/ACR-P0-008_POST_G04_COMMAND_BINDING_v1.0.json'
      - 'recovery/p1-wave10/**'
      - '.github/workflows/p1-wave10-execution.yml'

permissions:
  contents: read

jobs:
  execution-runtime:
    runs-on: [self-hosted, Windows, X64, eims-lab]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Build Wave 10 Execution lifecycle tests
        shell: pwsh
        run: dotnet build .\tests\EIMS.P1.Wave10.Execution.ContractTests\EIMS.P1.Wave10.Execution.ContractTests.csproj -c Release

      - name: Run Wave 10 Execution lifecycle tests
        shell: pwsh
        run: dotnet run --project .\tests\EIMS.P1.Wave10.Execution.ContractTests\EIMS.P1.Wave10.Execution.ContractTests.csproj -c Release --no-build

      - name: Build Wave 10 Execution handoff intake tests
        shell: pwsh
        run: dotnet build .\tests\EIMS.P1.Wave10.ExecutionIntake.ContractTests\EIMS.P1.Wave10.ExecutionIntake.ContractTests.csproj -c Release

      - name: Run Wave 10 Execution handoff intake tests
        shell: pwsh
        run: dotnet run --project .\tests\EIMS.P1.Wave10.ExecutionIntake.ContractTests\EIMS.P1.Wave10.ExecutionIntake.ContractTests.csproj -c Release --no-build

      - name: Verify ACR-P0-008 machine decision remains valid
        shell: pwsh
        run: |
          dotnet build .\tools\EIMS.ACR.P0.008.Verifier\EIMS.ACR.P0.008.Verifier.csproj -c Release
          dotnet run --project .\tools\EIMS.ACR.P0.008.Verifier\EIMS.ACR.P0.008.Verifier.csproj -c Release --no-build -- .\architecture\decisions\ACR-P0-008_POST_G04_COMMAND_BINDING_v1.0.json

      - name: Run Wave 9 Portfolio regression
        shell: pwsh
        run: |
          dotnet build .\tests\EIMS.P1.Wave9.Portfolio.ContractTests\EIMS.P1.Wave9.Portfolio.ContractTests.csproj -c Release
          dotnet run --project .\tests\EIMS.P1.Wave9.Portfolio.ContractTests\EIMS.P1.Wave9.Portfolio.ContractTests.csproj -c Release --no-build

      - name: Run P1-P5 Wave 9 binding regression
        shell: pwsh
        run: |
          dotnet build .\tests\EIMS.P1P5.Wave9PortfolioBinding.ContractTests\EIMS.P1P5.Wave9PortfolioBinding.ContractTests.csproj -c Release
          dotnet run --project .\tests\EIMS.P1P5.Wave9PortfolioBinding.ContractTests\EIMS.P1P5.Wave9PortfolioBinding.ContractTests.csproj -c Release --no-build
