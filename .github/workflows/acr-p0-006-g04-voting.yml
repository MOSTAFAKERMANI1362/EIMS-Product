name: ACR P0 006 G04 Voting

on:
  pull_request:
    paths:
      - 'architecture/decisions/ACR-P0-006_G04_COMMITTEE_VOTING_v1.0.json'
      - 'architecture/decisions/ACR-P0-006_G04_COMMITTEE_VOTING_v1.0.md'
      - 'tests/EIMS.ACR.P0.G04Voting.ContractTests/**'
      - '.github/workflows/acr-p0-006-g04-voting.yml'
  push:
    branches: [ main ]
    paths:
      - 'architecture/decisions/ACR-P0-006_G04_COMMITTEE_VOTING_v1.0.json'
      - 'architecture/decisions/ACR-P0-006_G04_COMMITTEE_VOTING_v1.0.md'
      - 'tests/EIMS.ACR.P0.G04Voting.ContractTests/**'
      - '.github/workflows/acr-p0-006-g04-voting.yml'

permissions:
  contents: read

jobs:
  verify-g04-voting-contract:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Build ACR-P0-006 contract tests
        run: dotnet build .\tests\EIMS.ACR.P0.G04Voting.ContractTests\EIMS.ACR.P0.G04Voting.ContractTests.csproj -c Release

      - name: Run ACR-P0-006 contract tests
        run: dotnet run --project .\tests\EIMS.ACR.P0.G04Voting.ContractTests\EIMS.ACR.P0.G04Voting.ContractTests.csproj -c Release --no-build -- .\architecture\decisions\ACR-P0-006_G04_COMMITTEE_VOTING_v1.0.json
