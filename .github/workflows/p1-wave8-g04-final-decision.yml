name: P1 Wave 8 G04 Final Decision

on:
  pull_request:
    paths:
      - 'architecture/decisions/ACR-P0-007_G04_FINAL_DECISION_v1.0.json'
      - 'architecture/decisions/ACR-P0-007_ROUTE_INTEGRITY_ADDENDUM_v1.0.json'
      - 'recovery/g04-decision/**'
      - 'recovery/p1-wave8/**'
      - 'src/EIMS.Authority.Recovery/**'
      - 'src/EIMS.Persistence.Recovery/**'
      - 'tests/EIMS.P1.Wave8.G04FinalDecision.ContractTests/**'
      - '.github/workflows/p1-wave8-g04-final-decision.yml'
  push:
    branches: [ main ]
    paths:
      - 'recovery/p1-wave8/**'
      - 'src/EIMS.Authority.Recovery/**'
      - 'src/EIMS.Persistence.Recovery/**'
      - 'tests/EIMS.P1.Wave8.G04FinalDecision.ContractTests/**'
      - '.github/workflows/p1-wave8-g04-final-decision.yml'

permissions:
  contents: read

jobs:
  final-decision:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Build Wave 8B final-decision tests
        run: dotnet build .\tests\EIMS.P1.Wave8.G04FinalDecision.ContractTests\EIMS.P1.Wave8.G04FinalDecision.ContractTests.csproj -c Release

      - name: Run Wave 8B final-decision tests
        run: dotnet run --project .\tests\EIMS.P1.Wave8.G04FinalDecision.ContractTests\EIMS.P1.Wave8.G04FinalDecision.ContractTests.csproj -c Release --no-build -- .\architecture\decisions\ACR-P0-007_G04_FINAL_DECISION_v1.0.json .\recovery\p1-wave8\P1_WAVE8_G04_FINAL_DECISION_REBASELINE_v1.0.json
