name: ACR P0 003 G03 Mutation Contract

on:
  pull_request:
    paths:
      - 'architecture/decisions/ACR-P0-003_G03_MUTATION_ROUTING_v1.0.json'
      - 'architecture/decisions/ACR-P0-003_G03_MUTATION_ROUTING_v1.0.md'
      - 'architecture/decisions/ACR-P0-002_G03_EVENT_CONTRACTS_v1.0.json'
      - 'tests/EIMS.ACR.P0.G03Mutation.ContractTests/**'
      - '.github/workflows/acr-p0-003-g03-mutation.yml'
  push:
    branches: [ main ]
    paths:
      - 'architecture/decisions/ACR-P0-003_G03_MUTATION_ROUTING_v1.0.json'
      - 'architecture/decisions/ACR-P0-003_G03_MUTATION_ROUTING_v1.0.md'
      - 'architecture/decisions/ACR-P0-002_G03_EVENT_CONTRACTS_v1.0.json'
      - 'tests/EIMS.ACR.P0.G03Mutation.ContractTests/**'
      - '.github/workflows/acr-p0-003-g03-mutation.yml'

permissions:
  contents: read

jobs:
  verify-acr:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Build ACR-P0-003 contract tests
        run: dotnet build .\tests\EIMS.ACR.P0.G03Mutation.ContractTests\EIMS.ACR.P0.G03Mutation.ContractTests.csproj -c Release

      - name: Run ACR-P0-003 contract tests
        run: dotnet run --project .\tests\EIMS.ACR.P0.G03Mutation.ContractTests\EIMS.ACR.P0.G03Mutation.ContractTests.csproj -c Release --no-build -- .\architecture\decisions\ACR-P0-003_G03_MUTATION_ROUTING_v1.0.json .\architecture\decisions\ACR-P0-002_G03_EVENT_CONTRACTS_v1.0.json
