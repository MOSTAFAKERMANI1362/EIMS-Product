name: Pilot Environment Evidence Pack

on:
  pull_request:
    paths:
      - 'pilot/scripts/Collect-EimsPilotEnvironmentEvidence.ps1'
      - 'pilot/scripts/Run-EIMS-Lab-Evidence.cmd'
      - 'pilot/scripts/Run-EIMS-Pilot-Evidence.cmd'
      - 'pilot/PILOT_ENVIRONMENT_EVIDENCE_README.md'
      - 'tools/EIMS.PilotEnvironmentEvidenceVerifier/**'
      - '.github/workflows/pilot-environment-evidence.yml'
  push:
    branches: [ main ]
    paths:
      - 'pilot/scripts/Collect-EimsPilotEnvironmentEvidence.ps1'
      - 'pilot/scripts/Run-EIMS-Lab-Evidence.cmd'
      - 'pilot/scripts/Run-EIMS-Pilot-Evidence.cmd'
      - 'pilot/PILOT_ENVIRONMENT_EVIDENCE_README.md'
      - 'tools/EIMS.PilotEnvironmentEvidenceVerifier/**'
      - '.github/workflows/pilot-environment-evidence.yml'

permissions:
  contents: read

jobs:
  smoke-test-collector:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Run one-click LAB evidence runner
        shell: cmd
        run: |
          set EIMS_NO_PAUSE=1
          call pilot\scripts\Run-EIMS-Lab-Evidence.cmd
          if not exist pilot\scripts\eims-pilot-environment-evidence.json exit /b 1

      - name: Build evidence verifier
        shell: pwsh
        run: dotnet build .\tools\EIMS.PilotEnvironmentEvidenceVerifier\EIMS.PilotEnvironmentEvidenceVerifier.csproj -c Release

      - name: Verify secret-free evidence output
        shell: pwsh
        run: dotnet run --project .\tools\EIMS.PilotEnvironmentEvidenceVerifier\EIMS.PilotEnvironmentEvidenceVerifier.csproj -c Release --no-build -- .\pilot\scripts\eims-pilot-environment-evidence.json
