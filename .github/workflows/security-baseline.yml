name: EIMS Security Baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check prohibited repository paths
        run: python3 scripts/ci/repository_policy_check.py

  trivy-security:
    name: Trivy filesystem security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.71.0
          cache: true

      - name: Scan vulnerabilities, secrets and misconfiguration
        run: >-
          trivy fs
          --scanners vuln,secret,misconfig
          --severity HIGH,CRITICAL
          --exit-code 1
          --no-progress
          .

      - name: Generate CycloneDX SBOM
        if: always()
        run: >-
          trivy fs
          --format cyclonedx
          --output eims-sbom.cdx.json
          --no-progress
          .

      - name: Upload SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eims-sbom-${{ github.sha }}
          path: eims-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
