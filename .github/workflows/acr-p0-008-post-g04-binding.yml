name: ACR-P0-008 Post-G04 Binding

on:
  pull_request:
    paths:
      - 'architecture/decisions/ACR-P0-008_POST_G04_COMMAND_BINDING_v1.0.json'
      - 'architecture/decisions/ACR-P0-008_POST_G04_COMMAND_BINDING_v1.0.md'
      - 'tools/EIMS.ACR.P0.008.Verifier/**'
      - '.github/workflows/acr-p0-008-post-g04-binding.yml'
  push:
    branches: [ main ]
    paths:
      - 'architecture/decisions/ACR-P0-008_POST_G04_COMMAND_BINDING_v1.0.json'
      - 'architecture/decisions/ACR-P0-008_POST_G04_COMMAND_BINDING_v1.0.md'
      - 'tools/EIMS.ACR.P0.008.Verifier/**'
      - '.github/workflows/acr-p0-008-post-g04-binding.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10.0.302
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.302'

      - name: Build ACR-P0-008 verifier
        shell: pwsh
        run: dotnet build .\tools\EIMS.ACR.P0.008.Verifier\EIMS.ACR.P0.008.Verifier.csproj -c Release

      - name: Verify ACR-P0-008 machine decision
        shell: pwsh
        run: dotnet run --project .\tools\EIMS.ACR.P0.008.Verifier\EIMS.ACR.P0.008.Verifier.csproj -c Release --no-build -- .\architecture\decisions\ACR-P0-008_POST_G04_COMMAND_BINDING_v1.0.json
